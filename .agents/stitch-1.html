<script>
        function selectOption(element, value) {
            // Remove selection from all cards
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selection to clicked card
            element.classList.add('selected');
            
            // Enable and style the continue button
            const btn = document.getElementById('continue-btn');
            btn.disabled = false;
            btn.classList.remove('bg-berry/40', 'opacity-50', 'cursor-not-allowed');
            btn.classList.add('bg-berry', 'opacity-100', 'cursor-pointer');
            
            // Add a small bounce effect on click
            element.style.transform = "scale(0.95)";
            setTimeout(() => {
                element.style.transform = "";
            }, 150);
        }

        // Atmospheric micro-interaction for cards
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (y - centerY) / 20;
                const rotateY = (centerX - x) / 20;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            });
        });
    </script>
